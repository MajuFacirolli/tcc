services:
  postgres:
    image: postgres:17
    container_name: hemoconnect_db
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: hemoconnect
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: hemoconnect_redis
    ports:
      - "6379:6379"
